# configs/module02/simulation_config.yaml
# Module 02 Simulation Environment Configuration (V1.3 Specification)

metadata:
  subsystem: "MODULE_02_SIMULATION_ENGINE"
  model_version: "1.3.0"
  config_version: "1.0.0"
  schema: "SIH26054_SIMULATION_CONFIG_V1"

architecture:
  default_aircraft_config: "configs/module02/aircraft/tapas_bh201.yaml"
  default_engine_config: "configs/module02/engines/rotax_914.yaml"
  default_propeller_config: "configs/module02/propellers/tapas_bh201_reference_propeller.yaml"

time:
  default_dt_seconds: 0.01                 # Physics integration step dt (100 Hz)
  min_dt_seconds: 0.001
  max_dt_seconds: 0.1
  telemetry_publish_rate_hz: 50.0          # Telemetry output publishing rate (50 Hz)

randomness:
  default_seed: 42                         # Master seed for deterministic reproducibility
  use_deterministic_noise: true

output:
  csv_enabled: true
  csv_output_path: "storage/simulated/simulated_telemetry_latest.csv"
  buffer_capacity_records: 10000

scenario:
  default_scenario_id: "NONE"
  default_mission_profile: "TAPAS_BH201_ISR_PATROL"
