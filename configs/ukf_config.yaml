# UKF State Estimation Configuration
# PHASE 2D Digital Twin Core

# Sigma-point generation parameters
alpha: 1e-3  # Spread of sigma points
beta: 2.0    # Optimal for Gaussian distributions
kappa: 0.0   # Secondary scaling parameter

# Numerical stability
numerical_tolerance: 1e-6

# State vector definition:
# [0] rpm
# [1] map_bar
# [2] turbo_rpm
# [3] airflow_kg_h
# [4] fuel_flow_kg_h
# [5] afr
# [6] cht_c
# [7] oil_temp_c

# Process Noise Covariance (Q) - Engineering assumptions for model transition uncertainty
Q:
  - 100.0   # rpm variance
  - 0.01    # map_bar variance
  - 1000.0  # turbo_rpm variance
  - 1.0     # airflow_kg_h variance
  - 0.1     # fuel_flow_kg_h variance
  - 0.01    # afr variance
  - 0.5     # cht_c variance
  - 0.5     # oil_temp_c variance

# Measurement Noise Covariance (R) - Calibration parameters for sensor noise
R:
  - 50.0    # rpm variance
  - 0.005   # map_bar variance
  - 500.0   # turbo_rpm variance
  - 0.5     # airflow_kg_h variance
  - 0.05    # fuel_flow_kg_h variance
  - 0.05    # afr variance
  - 1.0     # cht_c variance
  - 1.0     # oil_temp_c variance

# Initial State Covariance (P0)
P0:
  - 500.0
  - 0.05
  - 5000.0
  - 5.0
  - 0.5
  - 0.1
  - 5.0
  - 5.0
