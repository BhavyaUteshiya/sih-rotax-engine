[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotax-914-physics-foundation"
version = "0.1.0"
description = "Phase 1 reduced-order physics foundation for the SIH Rotax 914 UL/F digital twin"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
